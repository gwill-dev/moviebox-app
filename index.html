<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieBox App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">MovieBox</div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search movie..." />
      <button onclick="searchMovie()">Search</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="overlay"></div>

    <div class="hero-content">
      <h1>Unlimited Movies, One Place</h1>
      <p>Discover trending movies and enjoy entertainment anytime.</p>
      <button>Start Watching</button>
    </div>
  </section>

  <!-- Movie Section -->
  <section class="movies-section">
    <h2>Trending Movies</h2>

    <div class="movies-container" id="moviesContainer">

      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop" alt="movie">

        <div class="movie-info">
          <h3>Inception</h3>
          <p>2010 • Sci‑Fi</p>
          <span>⭐ 8.8</span>

          <div class="buttons">
            <button>Watch</button>
            <button>+</button>
          </div>
        </div>
      </div>

      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200&auto=format&fit=crop" alt="movie">

        <div class="movie-info">
          <h3>Interstellar</h3>
          <p>2014 • Adventure</p>
          <span>⭐ 8.7</span>

          <div class="buttons">
            <button>Watch</button>
            <button>+</button>
          </div>
        </div>
      </div>

      <div class="movie-card">
        <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1200&auto=format&fit=crop" alt="movie">

        <div class="movie-info">
          <h3>The Dark Knight</h3>
          <p>2008 • Action</p>
          <span>⭐ 9.0</span>
</html>
