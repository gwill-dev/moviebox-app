<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MovieBox App</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="logo">
      MovieBox
    </div>

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search movie..."
      />

      <button onclick="searchMovie()">
        Search
      </button>

    </div>

  </header>

  <!-- HERO -->
  <section class="hero">

    <div class="overlay"></div>

    <div class="hero-content">

      <h1>
        Unlimited Movies,
        One Place
      </h1>

      <p>
        Discover trending movies and enjoy entertainment anytime.
      </p>

      <button onclick="loadTrendingMovies()">
        Start Watching
      </button>

    </div>

  </section>

  <!-- MOVIES -->
  <section class="movies-section">

    <div class="section-header">

      <h2>
        Trending Movies
      </h2>

      <button onclick="loadTrendingMovies()">
        Refresh
      </button>

    </div>

    <div
      class="movies-container"
      id="moviesContainer"
    ></div>

  </section>

  <!-- WATCHLIST -->
  <section class="watchlist-section">

    <h2>
      My Watchlist
    </h2>

    <div
      class="movies-container"
      id="watchlistContainer"
    ></div>

  </section>

  <!-- FOOTER -->
  <footer>

    <p>
      © 2026 MovieBox App
    </p>

  </footer>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>

</html>
